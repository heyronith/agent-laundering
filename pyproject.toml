[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorytask"
version = "0.1.0"
description = "Do AI agents launder their own misconduct in memory?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "python-dotenv==1.1.0",
  "openai==1.109.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "respx==0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
