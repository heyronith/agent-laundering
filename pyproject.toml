[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorytask"
version = "0.1.0"
description = "Do AI agents launder their own misconduct in memory?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PyYAML==6.0.2",
  "python-dotenv==1.2.1",
  "openai==1.109.1",
  "smolagents==1.23.0",
  "python-pptx==1.0.2",
  "yt-dlp==2025.12.8",
  "langchain-community==0.4.1",
  "nltk==3.9.2",
  "openpyxl==3.1.5",
  "pypdf==6.4.0",
  "Wikipedia-API==0.8.1",
  "markdownify==1.2.0",
  "duckduckgo-search==8.1.1",
  "beautifulsoup4==4.13.4",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "respx==0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
