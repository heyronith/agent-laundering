# Subject + judge models for memorytask.
# PROVIDER RULE: prefer first-party; else single third-party in {bf16,fp16,fp8};
# never fp4/mxfp4/int4; uptime >= 99%; pin exactly one provider.

models:
  deepseek:
    # T01-FIX D003: first-party DeepSeek blocked by account training guardrail (kept OFF).
    # Tried order and result: Nebius(fp8) PASSED smoke a+b first; Parasail/Novita not needed.
    # Nebius fp8 @ $0.30/$1.20 per 1M in/out, uptime_last_30m=100.
    slug: deepseek/deepseek-v4.1-flash-1017
    role: subject
    provider_order:
      - Nebius
    allow_fallbacks: false
    quantization: fp8
    context_length: 1048576
    temperature: 1.0
    max_tokens: 256
    reasoning:
      effort: low

  glm:
    # T01-FIX D002: z-ai/glm-5.3-flash (dated slug not listed).
