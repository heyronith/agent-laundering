    # reasoning.enabled=false rejected ("Reasoning is mandatory..."); using lowest effort.
    slug: z-ai/glm-5.3-flash
    role: subject
    provider_order:
      - Z.AI
    allow_fallbacks: false
    quantization: fp8
    context_length: 1048576
    temperature: 1.0
    max_tokens: 256
    reasoning:
      effort: low

